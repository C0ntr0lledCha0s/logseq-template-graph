name: Build Schema Library

on:
  push:
    branches: [main, develop]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'src/**'
      - 'bb.edn'
      - 'vendor/**'
      - '.github/workflows/build-templates.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'src/**'
      - 'bb.edn'
      - 'vendor/**'
      - '.github/workflows/build-templates.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && ./install && rm install

      - name: Verify Babashka installation
        run: bb --version

      - name: Build schema library
        run: bb build

      - name: Show build statistics
        run: |
          echo "## Build Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in build/schema-library.edn build/schema-presets.edn; do
            echo "### $(basename "$file")" >> $GITHUB_STEP_SUMMARY
            echo "- Lines: $(wc -l < "$file")" >> $GITHUB_STEP_SUMMARY
            echo "- Size: $(du -h "$file" | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schema-library
          path: |
            build/schema-library.edn
            build/schema-presets.edn
          if-no-files-found: error
          retention-days: 30
