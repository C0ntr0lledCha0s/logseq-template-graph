name: Create Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'src/**'
      - 'bb.edn'
      - 'vendor/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v0.3.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Checkout logseq/logseq
        uses: actions/checkout@v4
        with:
          repository: logseq/logseq
          ref: 69da7e2215b336cc5123dafb2a1686996e39596c
          path: logseq
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install logseq scripts dependencies
        working-directory: logseq/scripts
        run: npx pnpm@10.33.0 install --ignore-workspace

      - name: Install Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && ./install && rm install

      - name: Run unit tests
        run: bb test

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF#refs/tags/}" = "v$(node -p "require('./package.json').version")" || {
            echo "Tag ${GITHUB_REF#refs/tags/} does not match package.json version"; exit 1; }

      - name: Build schema library
        run: bb build

      - name: Validate build output
        run: bb validate

      - name: Check import into Logseq
        run: LOGSEQ_DIR=$GITHUB_WORKSPACE/logseq bb check-import

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

          # Generate changelog from conventional commits
          echo "Generating changelog from conventional commits..."
          if npx git-conventional-commits changelog --release "$TAG" > conventional_notes.txt 2>/dev/null; then
            echo "Using generated changelog from commits"
            cat conventional_notes.txt > release_notes.txt
          elif [ -f "CHANGELOG.md" ]; then
            echo "Using existing CHANGELOG.md"
            NOTES=$(sed -n "/## $TAG/,/## /p" CHANGELOG.md | sed '$d')
            echo "$NOTES" > release_notes.txt
          else
            echo "Release $TAG" > release_notes.txt
          fi

          # Add download instructions
          echo "" >> release_notes.txt
          echo "---" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "## 📥 Download Instructions" >> release_notes.txt
          echo "" >> release_notes.txt
          echo "Download \`schema-library.edn\` below and import it via Logseq **Import → EDN to DB Graph**. Alternatively, build a role with the Ontology Sync plugin, which reads both \`schema-library.edn\` and \`schema-presets.edn\`." >> release_notes.txt
          echo "" >> release_notes.txt
          echo "> ⚠️ **Important:** Do NOT download the \"Source code\" archives if you only need the schema library. They contain development files for version control and devops, not the ready-to-use files." >> release_notes.txt
          echo "" >> release_notes.txt
          echo "## Files" >> release_notes.txt
          echo "" >> release_notes.txt

          for file in build/schema-library.edn build/schema-presets.edn; do
            echo "### $(basename "$file")" >> release_notes.txt
            echo "- **Lines:** $(wc -l < "$file")" >> release_notes.txt
            echo "" >> release_notes.txt
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.release_notes.outputs.TAG }}
          body_path: release_notes.txt
          files: |
            build/schema-library.edn
            build/schema-presets.edn
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release summary
        run: |
          echo "## Release Created: ${{ steps.release_notes.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
          cat release_notes.txt >> $GITHUB_STEP_SUMMARY
