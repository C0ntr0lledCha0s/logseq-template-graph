name: Test Schema Library

on:
  pull_request:
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'bb.edn'
      - 'vendor/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main, develop]
    paths:
      - 'source/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'bb.edn'
      - 'vendor/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test-build-validate:
    name: Test, Build and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && ./install && rm install

      - name: Run unit tests
        run: bb test

      - name: Build schema library
        run: bb build

      - name: Validate build output
        run: bb validate

  import-check:
    name: Import Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout logseq/logseq
        uses: actions/checkout@v4
        with:
          repository: logseq/logseq
          ref: 69da7e2215b336cc5123dafb2a1686996e39596c
          path: logseq
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install logseq scripts dependencies
        working-directory: logseq/scripts
        run: npx pnpm@10.33.0 install --ignore-workspace

      - name: Install Babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          chmod +x install && ./install && rm install

      - name: Build schema library
        run: bb build

      - name: Import into a fresh Logseq graph
        run: LOGSEQ_DIR=$GITHUB_WORKSPACE/logseq bb check-import

